version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: edgento_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/edgento_dev
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
    depends_on:
      - postgres

volumes:
  postgres-data:
